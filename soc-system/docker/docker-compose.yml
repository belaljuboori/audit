name: soc-live-monitoring

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: soc_live_monitoring
      SOC_APP_DB_PASSWORD: ${SOC_APP_DB_PASSWORD}
      SOC_MIGRATOR_DB_PASSWORD: ${SOC_MIGRATOR_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    # No ports published to the host in production — only sibling containers
    # on the internal 'data' network (and phpMyAdmin, for manual DBA access)
    # can reach MariaDB. Uncomment for local development only:
    # ports: ["3306:3306"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  # One-shot migration + seed job. NOT part of the always-on stack — run
  # explicitly during deploys: `docker compose run --rm db-migrate`.
  db-migrate:
    build:
      context: ../backend
      target: migrator
    environment:
      DATABASE_URL: mysql://soc_migrator:${SOC_MIGRATOR_DB_PASSWORD}@mariadb:3306/soc_live_monitoring
      SEED_SUPER_ADMIN_USERNAME: ${SEED_SUPER_ADMIN_USERNAME:-admin}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-admin@bank.local}
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [data]
    profiles: ["tools"]

  # One-shot grant-hardening job, run once after the FIRST db-migrate
  # (see docker/mariadb/harden-grants.sql for why this can't happen at
  # container-init time): `docker compose run --rm db-harden`.
  db-harden:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - "mysql -h mariadb -uroot -p\"$$MYSQL_ROOT_PASSWORD\" < /harden-grants.sql && echo 'soc_app grants hardened.'"
    volumes:
      - ./mariadb/harden-grants.sql:/harden-grants.sql:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [data]
    profiles: ["tools"]

  backend:
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      DATABASE_URL: mysql://soc_app:${SOC_APP_DB_PASSWORD}@mariadb:3306/soc_live_monitoring
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 7
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      LOG_LEVEL: info
      DEMO_MODE: "false"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data, web]
    # No host ports published — only reachable through the nginx reverse proxy.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks: [web]

  # Database administration UI ONLY — never used by the application itself
  # to connect to MariaDB. Bind to localhost or remove entirely outside of
  # a controlled admin/maintenance network segment.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mariadb
    networks: [data]
    profiles: ["dba"]

networks:
  # Backend <-> DB/Redis only. Nginx and the outside world never touch this
  # network directly — this is the "separate the management/data network
  # from the user network" requirement, expressed at the compose level.
  data:
    internal: true
  web: {}

volumes:
  mariadb_data:
  redis_data:
